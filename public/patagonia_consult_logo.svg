    stroke="#221f20"
    stroke-width="6.5"
    stroke-linecap="round"
  />
  <!-- Registered Symbol -->
  <text x="56" y="14" font-size="7.5" font-weight="bold" fill="#221f20" font-family="Arial, sans-serif">®</text>

  <!-- Inner Flame Drop (Orange) -->
  <path
    d="M 36 19 C 36 19 22 32 22 41 C 22 49 28 54 36 54 C 44 54 50 49 50 41 C 50 32 36 19 36 19 Z"
