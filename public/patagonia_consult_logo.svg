  <text x="84" y="25" font-size="20" font-weight="800" fill="#221f20" font-family="Arial, 'Helvetica Neue', sans-serif" letter-spacing="1">PATAGONIA</text>

  <!-- CONSULT SRL. -->
  <text x="84" y="47" font-size="20" font-weight="800" fill="#221f20" font-family="Arial, 'Helvetica Neue', sans-serif" letter-spacing="1">CONSULT SRL.</text>

  <!-- Oil & Gas -->
  <text x="84" y="66" font-size="15" font-weight="600" font-style="italic" fill="#ee7218" font-family="'Georgia', 'Times New Roman', serif">Oil &amp; Gas</text>
